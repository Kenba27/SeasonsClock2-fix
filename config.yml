# ===================== LICH + MUA (theo ngay trong game) =====================
# 1 ngay game = 20 phut that. Nguoi choi ngu qua dem thi ngay do nhay luon sang ngay moi.
# SeasonsClock tu dong dieu khien mua cua SeasonsPlus, season-duration trong Seasons/config.yml khong con tac dung.

# 30 ngay = 1 thang, 3 thang = 1 mua (=> 90 ngay game = 1 mua, 12 thang = 1 nam)
days-per-month: 30
months-per-season: 3

# Nam bat dau
start-year: 1

# Ten the gioi dung de tinh ngay. De trong = the gioi chinh.
world: ""

# false = lich bat dau tu mua Xuan, ngay 1/1 vao luc plugin chay lan dau.
# true  = tinh tu ngay dau tien cua the gioi (ngay 0).
# De dat lai lich: xoa file plugins/SeasonsClock/data.yml roi restart.
start-from-world-start: false

# Dinh dang ngay: %seasonclock_date% va %seasonclock_fulldate%
# Dung duoc: {day} {month} {year} {monthname}
date-format: "{day}/{month}/{year}"
full-date-format: "Ngày {day} {monthname} Năm {year}"

# Dinh dang cho %seasonclock_timeleft% (so ngay game con lai cua mua)
time-left-format: "Còn {days} ngày"

# Ten thang (theo thu tu thang 1, 2, 3...). %seasonclock_monthname%
month-names:
  - "Tháng Một"
  - "Tháng Hai"
  - "Tháng Ba"
  - "Tháng Tư"
  - "Tháng Năm"
  - "Tháng Sáu"
  - "Tháng Bảy"
  - "Tháng Tám"
  - "Tháng Chín"
  - "Tháng Mười"
  - "Tháng Mười Một"
  - "Tháng Mười Hai"

# ===================== THONG BAO DOI MUA =====================
announcements:
  enabled: true
  seasons:
    SPRING:
      title: "&a❀ Mùa Xuân"
      subtitle: "&7Cây cối nảy mầm, trời ấm dần"
      message: "&a❀ Mùa Xuân đã đến! Thời tiết ấm lên, hoa lá đua nở."
    SUMMER:
      title: "&6☀ Mùa Hè"
      subtitle: "&7Nắng gắt, hãy giữ mình mát mẻ"
      message: "&6☀ Mùa Hè đã đến! Trời rất nóng, nhớ tìm bóng mát và nước."
    AUTUMN:
      title: "&c❧ Mùa Thu"
      subtitle: "&7Lá vàng rơi, trời se lạnh"
